[project]
name = "mediasiphon"
version = "0.1.0"
description = "A local console for driving N_m3u8DL-RE / ffmpeg from a web UI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pywebview>=5.1",
    "m3u8>=4.0.0",
    "mpegdash>=0.4.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "watchdog>=4.0",
    "nuitka>=2.6",
]

[project.scripts]
mediasiphon = "siphon.desktop:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["siphon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
